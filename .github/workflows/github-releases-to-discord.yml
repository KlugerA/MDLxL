name: Discord release announcements

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_name:
        description: Release title to announce
        required: true
        type: string
      release_body:
        description: Release notes to announce
        required: true
        type: string
      release_html_url:
        description: GitHub release URL
        required: true
        type: string

permissions: {}

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send release to MDLxL Discord
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          username: Mega Garithos Bot
          footer_title: MDLxL release
          reduce_headings: true
          release_name: ${{ inputs.release_name }}
          release_body: ${{ inputs.release_body }}
          release_html_url: ${{ inputs.release_html_url }}
